services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: indtec_catalog
      POSTGRES_USER: indtec
      POSTGRES_PASSWORD: indtec
    ports:
      - "5432:5432"
    volumes:
      - catalog-postgres:/var/lib/postgresql/data
      - ./database/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indtec -d indtec_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catalog-postgres: